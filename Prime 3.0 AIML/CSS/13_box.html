<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>CSS Level - 2</title>
</head>
<body>

    <h2 id="h1"> Heading1 </h2> 

    <h2 id="h2"> Heading2 </h2> 
    
    <h2 id="h3"> Heading3 </h2>
    
    <style>
        #h1{
            height: 100px;
            width: 100px;
            background-color: rgb(148, 139, 147);
            text-align: center;
            border-width: 2px;
            border-style: dashed;
            border-color: aqua;

            padding-top: 20px;
            padding: 20px;
            padding: 10px 15px 10px 15 px;

        #h2{
            height: 120px;

            padding: 20px;
            padding: 10px 15px 10px 15 px;

        }

        #h3{
            height: 120px;
            width: 120px;
            background-color: rgb(99, 166, 195);
