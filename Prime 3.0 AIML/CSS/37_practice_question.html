    <style>
        div{
            height: 300px;
            width: 300px;
            left: 500px;
            top: 250px;
            position: absolute;
            border-radius: 50%;
            border: 20px solid #B4D7CD;
            border-top: 20px solid #F47321;
            animation: practice 0.02ms ease-in 0s infinite normal;
            
        }
        
        @keyframes practice {
                0%{
                    rotate: 0deg;
                    background-color: aquamarine;
                }
                50%{
                    rotate: 180deg;
                    background-color: blue;
                }
                100%{
                    rotate: 360deg;
                    background-color: rgb(143, 12, 38);
                } 
            
        }
