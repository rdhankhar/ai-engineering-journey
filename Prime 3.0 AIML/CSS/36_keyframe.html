<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div> This is Box</div>
    
    <style>
        div{
            height: 100px;
            width: 100px;
            background-color: bisque;
            border: 2px solid black;
            left: 200px;
            top: 200px;
            position: absolute;
            animation: anime 4s ease-in 2s  4 normal;
            }

            @keyframes anime {
                0%  {left:0px;
                    background-color: blue;
                }
                50%{ background-color: green;

                }
                100%{
                    left:200px;
                    background-color: aquamarine; 
                }
                
            }
            
    </style>
</body>
</html>
