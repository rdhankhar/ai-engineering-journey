<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>This a Box</div>

    <style>
        div{
            height: 100px;
            width: 100px;
            background-color: aquamarine;
            border: 2px solid black;
            position: absolute;
            top: 100px;
            left: 100px;
            transition:  all 2s ease-in;
            
        }

        div:hover{
            background-color: brown;
            color: beige;
            font-size: 20px;
            /* transform: rotate(90deg); */
            /* rotate: y 90deg; */
            /* transform: scaleY(2);
            transform: scaleX(0.5); */
            transform: scale(2,3);
        }

        div:active{
            background-color: rgb(159, 27, 207);
            color: rgb(212, 212, 22);
            font-size: 30px;
        }
    </style>
</body>

</body>
