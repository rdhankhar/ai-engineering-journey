<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex properties</title>
</head>
<body>
    <div id="container">

        <div id="b1">Box 1</div>
        <div id="b2">Box 2</div>
        <div id="b3">Box 3</div>
        <div id="b4">Box 4</div>
        <div id="b5">Box 5</div>

    </div>

    <style>
        div{
            height: 30px;
            width: 50px;
            display: inline-block;
            border: 2px solid black;
            color: azure;
            
        }

        #container{
            height: 200px;
            width: 600px;
            border: 2px solid black;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            justify-content: flex-start;
            justify-content: flex-end;
            justify-content: space-between;
            justify-content: center;
        }

        #b1{
            background-color: rgb(29, 141, 141);
        }

        #b2{
            background-color: rgb(105, 22, 28);
        }

        #b3{
            background-color: rgb(113, 30, 124);
        }

        #b4{
            background-color: rgb(75, 232, 18);
        }

        #b5{
            background-color: rgb(13, 48, 48);
        }
    </style>
</body>
</html>
