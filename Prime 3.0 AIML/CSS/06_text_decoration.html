<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text decoration</title>
</head>
<body>

    <!-- Text decoration -->

    <h1> Heading1 </h1>
    <h1> Heading2 </h1>

    <a href="https://www.google.com"> google </a>
    <style>
        h1{
            text-decoration: red underline dotted ;
        }

        h1{
            text-decoration: red line-through wavy ;
        }

        h1{
            text-decoration: greenyellow overline double ;
        }
        
        a{
            text-decoration: none;
        }
    </style>
    
</body>
</html>
