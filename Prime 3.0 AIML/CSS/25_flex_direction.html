<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
</head>
<body>
    <h1> Flex Box Playground </h1>
    <div id="Container">
        <div id="box1"> Box1</div>
        <div id="box2"> Box2</div>
        <div id="box3"> Box3</div>
        <div id="box4"> Box4</div>
        <div id="box5"> Box5</div>
    </div>

    <style>
        body{
            text-align: center;
        }

        div {
            height: 100px;
            width: 100px;
            display: inline-block;
            border: 2px solid black;
            
        }
        
        #Container {
            height: 200px;
            width: 800px;
            border: 2px solid black;
            display: flex;
            flex-direction: row-reverse;
            flex-direction: column;
            flex-direction: column-reverse;
            
        }

        #box1 {
            background-color: rgb(138, 239, 95);
        }

        #box2 {
            background-color: rgb(168, 63, 86);
        }

        #box3 {
            background-color: rgb(11, 248, 248);
        }

        #box4 {
            background-color: rgb(74, 101, 201);
        }

        #box5 {
            background-color: rgb(153, 219, 54);
        }
    </style>
</body>
</html>
