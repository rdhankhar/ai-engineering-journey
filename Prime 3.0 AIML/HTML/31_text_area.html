<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text area</title>
</head>
<body>
    <form action="server">
        
        <div>
            <label for="feedback"> Enter your feedback here : </label>
            <textarea id="feedback"  placeholder="Write your feedback here" row="10" col="15"  name="feedback" ></textarea>
        </div>
        <button>Submit</button>
    </form>
    
</body>
</html>
