<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sup vs Sub</title>
</head>
<body>
    <!-- sup is used for the upper power -->

    <p>a<sup>2</sup></p>

    <p>a<sup>2</sup> + b<sup>2</sup></p>

    <!-- sub is used for the lower -->

    <p>H<sub>2</sub>O</p>

    <p>B<sub>12</sup></p>
    
</body>
</html>
