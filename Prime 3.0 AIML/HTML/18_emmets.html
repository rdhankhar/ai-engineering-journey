<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmets</title>
</head>
<body>
    <!-- Child : -->

    <h1>
        <p><img src="" alt=""></p>
    </h1>

    <nav>
        <p><a href=""></a></p>
    </nav>

    <!-- Siblings : + -->

    <h1></h1>
    <div></div>
    <span></span>

    <p><img src="" alt=""><a href=""></a></p>

    <!-- Multiplication *  -->
    
    <h1>
        <ul>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
        </ul>
    </h1>

    <p><img src="" alt=""><img src="" alt=""><img src="" alt=""><img src="" alt=""><img src="" alt=""></p>
</body>
</html>
