<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range Element</title>
</head>
<body>

    <form action="server">

        <label for="vol">  Select volume : </label>
        <input type="range" id="vol" min="0" max="100"  name="volume" step="20" value="80"> 

        <button> Submit </button>
        
    </form>
    
</body>
</html>
