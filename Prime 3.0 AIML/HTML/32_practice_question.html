<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Question</title>
</head>
<body>
    <form action="server"> 

        <h3><b>Registration Form</b></h3>

        <div>
            <input type="text" placeholder="First Name" name="server">
            <input type="text" placeholder="Last Name" name="server">
        </div>

        <div>
            Please Select Gender

            <select name="gender" id="gender">
            <option val="male">Male</option>
            <option val="female">Female</option>

            </select>
        </div>
        <div>
            Do you agree to all term of services?

            <input type="checkbox" id="agree" name="server">
            <label for="agree">Yes, i agree</label>
        </div>

        <button>Register</button>
    </form>
    
</body>
</html>
