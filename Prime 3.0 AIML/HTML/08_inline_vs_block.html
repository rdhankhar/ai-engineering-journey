<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline vs Block</title>
</head>
<body>

    <!-- Block means all the data in next line even if you are writing a single word -->

    <h1> Hii </h1>

    <h1> Where are you </h1>

    <p> Good Morning! </p>
    
    <p> Good Night! </p>

    <!-- Inline  means all the data in same line no next line until line will full-->

    <a href="www.google.com">Google</a>

    <a href="www.youtube.com">Youtube</a> <br>

    <img src="https://png.pngtree.com/png-vector/20231017/ourmid/pngtree-3d-red-apple-png-with-green-leaf-png-image_10201408.png" alt="Apple" height="100px" width="100px">

    <img src="https://media.istockphoto.com/id/185284489/photo/orange.jpg?s=612x612&w=0&k=20&c=m4EXknC74i2aYWCbjxbzZ6EtRaJkdSJNtekh4m1PspE=" alt="Orange" height="100px" width="100px">
</body>
</html>
